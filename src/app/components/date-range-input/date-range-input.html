<form class="input-calendar-wrapper">
  <input
    (click)="toggleTabs()"
    placeholder="Date"
  />
</form>
@if (showTabs()) {
  <div class="tabs">
    <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start" fitInkBarToContent class="tabs-group" #tabsWrapper>
      <mat-tab label="Relative">
        <app-relative></app-relative>
      </mat-tab>
      <mat-tab label="Calendar">
        <app-calendar></app-calendar>
      </mat-tab>
    </mat-tab-group>

    <div class="actions">
      <button mat-button color="primary" (click)="apply()">Apply</button>
    </div>
  </div>
}
